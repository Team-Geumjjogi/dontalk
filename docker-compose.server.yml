# GPU server stack (RTX 3060, WSL2 Ubuntu + docker CLI). Not for local development.
# Run: docker compose -f docker-compose.server.yml --env-file .env.server up -d
# Model and adapter files are not in Git; place them under MODELS_DIR / ADAPTERS_DIR on the WSL ext4 disk
# (avoid /mnt/c, it is very slow for large weights).

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: dontalk-vllm
    restart: unless-stopped
    ipc: host
    ports:
      # Loopback only: vLLM has no auth, and api reaches it over the compose network (http://vllm:8000).
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    volumes:
      - ${MODELS_DIR}:/models:ro
      - ${ADAPTERS_DIR}:/adapters:ro

    # Base model is served as "exaone"; each LoRA adapter is selected
    # by its name in the request's "model" field.
    command: >
      --model /models/exaone-3.5-2.4b
      --served-model-name exaone
      --trust-remote-code
      --dtype half
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --tokenizer /models/tokenizer
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.85}
      --enable-lora
      --max-loras 3
      --max-lora-rank ${VLLM_MAX_LORA_RANK:-16}
      --lora-modules bank=/adapters/bank insurance=/adapters/insurance securities=/adapters/securities

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  api:
    build:
      context: ./ai
      dockerfile: Dockerfile

    container_name: dontalk-ai
    restart: unless-stopped

    ports:
      # Loopback by default (not reachable from other machines). If the web server runs on another host,
      # set AI_BIND in .env.server to this server's private IP (never 0.0.0.0 on a public interface).
      - "${AI_BIND:-127.0.0.1}:${AI_PORT:-8000}:8000"

    # Keep the downloaded embedding model across container rebuilds (it is fetched from Hugging Face on first start).
    volumes:
      - hf-cache:/root/.cache/huggingface

    environment:
      AI_MOCK_MODE: "${AI_MOCK_MODE:-false}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-http://vllm:8000/v1}"
      VLLM_TIMEOUT: "${VLLM_TIMEOUT:-40}"

      # RAG shared DB (read-only access, see ai/app/rag/retriever.py)
      DB_HOST: "${DB_HOST:?set DB_HOST in .env.server}"
      DB_PORT: "${DB_PORT:?set DB_PORT in .env.server}"
      DB_USER: "${DB_USER:?set DB_USER in .env.server}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env.server}"
      DB_NAME: "${DB_NAME:?set DB_NAME in .env.server}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_SSLNEGOTIATION: "${DB_SSLNEGOTIATION:-direct}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"

    depends_on:
      vllm:
        condition: service_healthy

volumes:
  hf-cache:
