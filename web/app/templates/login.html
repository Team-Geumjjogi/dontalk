<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돈톡 — 상담사/관리자 로그인</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 80px auto; padding: 0 12px; }
    h2 { text-align: center; }
    form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    input { padding: 10px; font-size: 14px; }
    button { padding: 10px; font-size: 14px; cursor: pointer; }
    .error { color: #c0392b; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <h2>돈톡 상담사/관리자 로그인</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="email" name="email" placeholder="이메일" required autofocus>
    <input type="password" name="password" placeholder="비밀번호" required>
    <button type="submit">로그인</button>
  </form>
</body>
</html>
