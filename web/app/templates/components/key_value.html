{#- 항목: 값 목록. items 는 (이름, 값) 쌍의 목록. 사용: {{ key_value([("분야", "은행"), ("신뢰도", "80%")]) }} -#}
{% macro key_value(items) %}
<dl class="key-value">
  {%- for label, value in items %}
  <div class="key-value__row"><dt>{{ label }}</dt><dd>{{ value if value not in (None, "") else "-" }}</dd></div>
  {%- endfor %}
</dl>
{% endmacro %}
