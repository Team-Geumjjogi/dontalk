{#- 카드. 내용은 {% call %} 블록으로 넣는다. tone="accent" 면 강조(앰버 톤) 카드.
    사용: {% call card(title="근거 있는 답변") %}설명 글{% endcall %} -#}
{% macro card(title=None, tone=None) %}
<section class="card{{ ' card--' ~ tone if tone }}">
  {%- if title %}
  <h3 class="card__title">{{ title }}</h3>
  {%- endif %}
  <div class="card__body">{{ caller() }}</div>
</section>
{% endmacro %}
