<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돈톡 DonTalk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body>
  <div class="phone-frame">

    <!-- 인트로 화면 -->
    <section id="screen-intro" class="screen active">
      <div></div>
      <div>
        <span class="badge">24시간 AI 금융 상담</span>
        <h1>돈 이야기가<br>더 이상 어렵지 않아요</h1>
        <p>돈에 대해 편하게 이야기하고, 금융 고민을 톡톡 풀어주는<br>AI 상담 서비스를 만나보세요.</p>
      </div>
      <button class="start-btn" id="start-btn">시작하기 →</button>
    </section>

    <!-- 채팅 화면 -->
    <section id="screen-chat" class="screen">
      <div class="chat-header">
        <span class="title">돈톡 AI</span>
        <span class="status">영업중</span>
      </div>
      <div id="log"></div>
      <button id="handoff-btn" class="handoff-btn" style="display:none;">상담사 연결하기</button>
      <form id="send-form">
        <input id="msg-input" placeholder="궁금한 금융 문의를 입력하세요" autocomplete="off">
        <button type="submit">전송</button>
      </form>
    </section>

    <!-- 상담 완료 모달 -->
    <div id="modal-complete" class="modal-overlay">
      <div class="modal-box">
        <div class="check">✔</div>
        <div><strong>상담 완료</strong></div>
        <p style="font-size:13px;color:#888;">AI 답변에 만족해주셔서 감사합니다.<br>언제든 또 궁금한 점이 있으면 톡해주세요.</p>
        <button id="modal-close-btn">확인</button>
      </div>
    </div>

    <!-- 상담사 연결: 이름 입력 모달 -->
    <div id="modal-handoff" class="modal-overlay">
      <div class="modal-box">
        <div><strong>상담사 연결</strong></div>
        <p style="font-size:13px;color:#888;">상담사가 확인할 수 있도록 이름을 알려주세요.</p>
        <form id="handoff-form">
          <input id="handoff-name" placeholder="이름" autocomplete="off" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;">
          <button type="submit" style="width:100%;">상담사 연결 요청</button>
        </form>
      </div>
    </div>

    <!-- 대기큐 등록 완료 모달 -->
    <div id="modal-queued" class="modal-overlay">
      <div class="modal-box">
        <div class="check">📨</div>
        <div><strong id="queued-title">접수 완료</strong></div>
        <p id="queued-desc" style="font-size:13px;color:#888;"></p>
        <button id="modal-queued-close-btn">확인</button>
      </div>
    </div>

  </div>

  <script>
    const logEl = document.getElementById("log");
    const handoffBtn = document.getElementById("handoff-btn");
    let currentConsultId = null;

    document.getElementById("start-btn").addEventListener("click", () => {
      document.getElementById("screen-intro").classList.remove("active");
      document.getElementById("screen-chat").classList.add("active");
    });

    function addBubble(sender, text) {
      const row = document.createElement("div");
      row.className = "bubble-row " + (sender === "me" ? "me" : "ai");
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (sender === "me" ? "me" : "ai");
      bubble.textContent = text;
      row.appendChild(bubble);
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
      return row;
    }

    function addFeedbackRow(consultId) {
      const wrap = document.createElement("div");
      wrap.className = "feedback-row";
      wrap.innerHTML = `
        <span class="meta">도움이 되었나요?</span>
        <button data-ok="1">🙂 만족</button>
        <button data-ok="0">🙁 불만족</button>
      `;
      wrap.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", async () => {
          wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
          const satisfied = btn.dataset.ok === "1";
          const res = await fetch("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ consult_id: consultId, satisfied }),
          });
          const data = await res.json();
          if (satisfied) {
            document.getElementById("modal-complete").classList.add("active");
          } else if (data.handoff_needed) {
            handoffBtn.style.display = "block";
          }
        });
      });
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById("send-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      const message = input.value.trim();
      if (!message) return;
      addBubble("me", message);
      input.value = "";

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      currentConsultId = data.consult_id;

      addBubble("ai", data.answer);
      addFeedbackRow(data.consult_id);

      if (data.handoff_needed) {
        handoffBtn.style.display = "block";
      }
    });

    handoffBtn.addEventListener("click", () => {
      document.getElementById("modal-handoff").classList.add("active");
    });

    document.getElementById("handoff-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("handoff-name");
      const name = nameInput.value.trim();
      if (!name) return;

      const res = await fetch("/api/handoff", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ consult_id: currentConsultId, name }),
      });
      const data = await res.json();

      document.getElementById("modal-handoff").classList.remove("active");
      nameInput.value = "";
      handoffBtn.style.display = "none";

      const titleEl = document.getElementById("queued-title");
      const descEl = document.getElementById("queued-desc");
      if (data.business_hours) {
        titleEl.textContent = "상담사 연결 중";
        descEl.textContent = "영업시간 내라 담당 분야 상담사에게 실시간으로 연결해 드립니다. 잠시만 기다려주세요.";
      } else {
        titleEl.textContent = "상담 요청 접수 완료";
        descEl.textContent = "영업시간 외라 상담 요청만 접수됐습니다. 익일 담당 상담사가 확인 후 연락드립니다.";
      }
      document.getElementById("modal-queued").classList.add("active");
    });

    document.getElementById("modal-close-btn").addEventListener("click", () => {
      document.getElementById("modal-complete").classList.remove("active");
    });

    document.getElementById("modal-queued-close-btn").addEventListener("click", () => {
      document.getElementById("modal-queued").classList.remove("active");
    });
  </script>
</body>
</html>
