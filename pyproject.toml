[project]
name = "dontalk"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "flask>=3.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "gdown>=6.4.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "pydantic>=2.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.31",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.29",
    "peft>=0.21.1",
    "torch>=2.6",
    "transformers>=4.56,<5.9",
    "accelerate>=1.0,<2",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43; sys_platform == 'linux' or sys_platform == 'win32'"]

[tool.uv]
package = false
